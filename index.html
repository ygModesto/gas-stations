<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Gasolineras en España</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Control Geocoder (Buscador de direcciones) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- FlatGeobuf JS (Lector de archivos binarios espaciales) -->
  <script src="https://unpkg.com/flatgeobuf@3.24.0/dist/flatgeobuf-geojson.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 10px 16px; background: #1e293b; color: white; display: flex; justify-content: space-between; align-items: center; }
    #map { flex: 1; width: 100%; }
    .info-bar { font-size: 0.85rem; color: #94a3b8; }
    .zoom-notice {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 1000;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .popup-title { font-weight: bold; font-size: 1.05rem; color: #0f172a; margin-bottom: 4px; }
    .popup-sub { font-size: 0.8rem; color: #64748b; margin-bottom: 6px; }
    .popup-price { font-size: 0.9rem; line-height: 1.4; }
    .price-tag { font-weight: bold; color: #16a34a; }
  </style>
</head>
<body>

  <header>
    <h1>Gasolineras España</h1>
    <div class="info-bar" id="last-update">Cargando datos...</div>
  </header>

  <div id="map"></div>
  <div id="zoom-notice" class="zoom-notice">Acerca el mapa para ver las gasolineras</div>

  <script>
    // 1. Inicializar mapa centrado en España
    const map = L.map('map').setView([40.416775, -3.703790], 6);

    // 2. Capa de mapas OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap | Datos: MITECO'
    }).addTo(map);

    // 3. Añadir buscador de calles / municipios
    L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Buscar municipio o calle..."
    })
    .on('markgeocode', function(e) {
      const bbox = e.geocode.bbox;
      map.fitBounds(bbox);
    })
    .addTo(map);

    // Group de capas para añadir y limpiar marcadores dinámicamente
    const markersGroup = L.layerGroup().addTo(map);
    const zoomNotice = document.getElementById('zoom-notice');

    // 4. Cargar la fecha desde meta.json ligero
    fetch('./public/meta.json')
      .then(res => res.json())
      .then(meta => {
        document.getElementById('last-update').textContent = `Actualizado: ${meta.fecha}`;
      })
      .catch(() => {
        document.getElementById('last-update').textContent = 'Datos disponibles';
      });

    // 5. Cargar únicamente las gasolineras visibles con FlatGeobuf
    async function updateMarkers() {
      // Si el zoom está muy alejado (< 9), no cargar para no saturar la vista
      if (map.getZoom() < 9) {
        markersGroup.clearLayers();
        zoomNotice.style.opacity = '1';
        return;
      }

      zoomNotice.style.opacity = '0';

      // Obtener el rectángulo de la pantalla visible actual
      const bounds = map.getBounds();
      const bbox = {
        minX: bounds.getWest(),
        minY: bounds.getSouth(),
        maxX: bounds.getEast(),
        maxY: bounds.getNorth()
      };

      markersGroup.clearLayers();

      try {
        // Deserialización por HTTP Range Request directo a public/gasolineras.fgb
        const iter = flatgeobuf.deserialize('./public/gasolineras.fgb', bbox);

        for await (const feature of iter) {
          const p = feature.properties;
          const [lng, lat] = feature.geometry.coordinates;

          const popupContent = `
            <div class="popup-title">${p.rotulo || 'Gasolinera'}</div>
            <div>${p.direccion || ''}</div>
            <div class="popup-sub">${p.municipio || ''} (${p.provincia || ''}) | ${p.horario || ''}</div>
            <hr style="margin: 6px 0; border: none; border-top: 1px solid #e2e8f0;">
            <div class="popup-price">
              ${p.ga ? `<div>Diésel A: <span class="price-tag">${p.ga.toFixed(3)} €</span></div>` : ''}
              ${p.gapp ? `<div>Diésel Premium: <span class="price-tag">${p.gapp.toFixed(3)} €</span></div>` : ''}
              ${p.g95 ? `<div>Gasolina 95: <span class="price-tag">${p.g95.toFixed(3)} €</span></div>` : ''}
              ${p.g98 ? `<div>Gasolina 98: <span class="price-tag">${p.g98.toFixed(3)} €</span></div>` : ''}
            </div>
          `;

          L.marker([lat, lng])
            .bindPopup(popupContent)
            .addTo(markersGroup);
        }
      } catch (err) {
        console.error('Error leyendo FlatGeobuf:', err);
      }
    }

    // Escuchar el evento cuando el usuario termina de mover o hacer zoom en el mapa
    map.on('moveend', updateMarkers);

    // Cargar marcadores iniciales al abrir si el mapa se inicia con zoom suficiente
    updateMarkers();
  </script>
</body>
</html>

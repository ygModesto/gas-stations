<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Gasolineras en España</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Control Geocoder (Buscador de direcciones) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 10px 16px; background: #1e293b; color: white; display: flex; justify-content: space-between; align-items: center; }
    #map { flex: 1; width: 100%; }
    .info-bar { font-size: 0.85rem; color: #94a3b8; }
    .popup-title { font-weight: bold; font-size: 1.1rem; color: #0f172a; margin-bottom: 4px; }
    .popup-price { margin-top: 6px; font-size: 0.95rem; }
    .price-tag { font-weight: bold; color: #16a34a; }
  </style>
</head>
<body>

  <header>
    <h1>Gasolineras España</h1>
    <div class="info-bar" id="last-update">Cargando datos...</div>
  </header>

  <div id="map"></div>

  <script>
    // 1. Inicializar mapa centrado en España
    const map = L.map('map').setView([40.416775, -3.703790], 6);

    // 2. Capa de mapas OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap | Datos: MITECO'
    }).addTo(map);

    // 3. Añadir buscador de calles / municipios
    L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Buscar municipio o calle..."
    })
    .on('markgeocode', function(e) {
      const bbox = e.geocode.bbox;
      map.fitBounds(bbox);
    })
    .addTo(map);

    // 4. Cargar JSON generado por el Action
    fetch('./public/gasolineras.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('last-update').textContent = `Actualizado: ${data.fecha}`;

        // Para mejor rendimiento en móviles, creamos un grupo de capas
        const markersGroup = L.layerGroup();

        data.estaciones.forEach(e => {
          const popupContent = `
            <div class="popup-title">${e.rotulo}</div>
            <div>${e.direccion} (${e.municipio})</div>
            <div style="font-size: 0.8rem; color: #64748b;">${e.horario}</div>
            <hr style="margin: 8px 0; border: none; border-top: 1px solid #e2e8f0;">
            <div class="popup-price">
              ${e.ga ? `<div>Diésel A: <span class="price-tag">${e.ga.toFixed(3)} €</span></div>` : ''}
              ${e.g95 ? `<div>Gasolina 95: <span class="price-tag">${e.g95.toFixed(3)} €</span></div>` : ''}
              ${e.g98 ? `<div>Gasolina 98: <span class="price-tag">${e.g98.toFixed(3)} €</span></div>` : ''}
            </div>
          `;

          L.marker([e.lat, e.lng])
            .bindPopup(popupContent)
            .addTo(markersGroup);
        });

        markersGroup.addTo(map);
      })
      .catch(err => {
        console.error('Error al cargar datos:', err);
        document.getElementById('last-update').textContent = 'Error al cargar los precios';
      });
  </script>
</body>
</html>

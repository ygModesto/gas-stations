name: Actualizar datos FlatGeobuf de Gasolineras

on:
  schedule:
    # Se ejecuta cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Cachear dependencias de Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fetch-data/target
          key: cargo-${{ hashFiles('fetch-data/Cargo.lock') }}

      # Descarga el JSON de MITECO y genera public/*.fgb y public/meta.json (ver fetch-data/src/main.rs).
      # Usa el TLS del sistema (OpenSSL): el servidor de MITECO solo admite TLS 1.2 con intercambio
      # de claves RSA, que rustls no soporta.
      - name: Descargar y convertir a FlatGeobuf
        run: cargo run --release --locked --manifest-path fetch-data/Cargo.toml

      - name: Commit y Push del archivo binario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/gasolineras.fgb public/gasolineras-lite.fgb public/meta.json
          git commit -m "update: archivo FlatGeobuf actualizado [skip ci]" || exit 0
          git push

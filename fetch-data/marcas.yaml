# Marcas de gasolineras con más de 10 estaciones en el dato de MITECO (gasolineras.json),
# pensado para alimentar un futuro script que descargue el logo de cada una por su web.
# Cifras de un volcado puntual del feed, no se recalculan solas -- si quieres números al día,
# hay que rehacer el recuento contra un gasolineras.json reciente.
#
# "gasolineras" cuenta coincidencia EXACTA del texto del rótulo, no la normalización por palabra
# que usa BRANDS en src/main.rs (que junta p.ej. "BP" y "BP OIL ESPAÑA" bajo la misma marca) --
# por eso aquí BP sale con 150 y no con 672. De estas marcas, las que además están en BRANDS
# (src/main.rs) ya se reconocen y colorean en el mapa; las que no, hoy caen en "Otras".
#
# "web" viene rellena solo en las que pude confirmar mirando su web oficial; el resto queda a
# "null" a propósito, para no meter una URL adivinada en un script que va a hacer peticiones
# reales -- complétalas a mano según las vayas confirmando. El destino es Brandfetch
# (brandfetch.com), así que interesa más el dominio raíz que un servicio de logos reconoce que la
# URL más "oficial" o geográficamente exacta -- ver la nota de Q8 más abajo.
#
# (SIN RÓTULO) y LIBRE no son marcas de verdad -- son gasolineras sin marca o independientes --
# se quedan aquí solo porque superan las 10 estaciones; no tiene sentido buscarles web ni logo.
#
# Q8 ya suma su rótulo IDS (la red de tarjeta de gasóleo para transporte de Kuwait Petroleum,
# renombrada Q8Truck en 2025), y GM OIL ya suma su rótulo GMOIL (misma cadena, dos grafías) --
# mismo criterio que aplica ahora BRANDS en src/main.rs.

marcas:
  - marca: REPSOL
    gasolineras: 2741
    web: repsol.com
  - marca: MOEVE
    gasolineras: 588
    web: moeveglobal.com # moeve.es cae en "Moeve Clientes" (marca distinta y sin SVG en Brandfetch);
    # moeveglobal.com es la ficha verificada (quality score 0.96 vs 0.72) y sí tiene SVG, aunque
    # solo del wordmark completo (180x49), no de un icono/símbolo compacto -- el icono para el
    # hueco circular del pin sigue siendo un jpeg (ver fetch-data/logos-raw/moeve/)
